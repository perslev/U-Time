# This files stores hyperparameters for the building and fitting of a model
# in the models library.
#
# Components prefixed CB are for callback hyperparameter settings

CB_tb: &TB
  # tensorboard
  nickname: "tb"
  class_name: "TensorBoard"
  kwargs: {log_dir: './tensorboard'}

CB_es: &ES
  # Early stopping
  nickname: "es"
  class_name: "EarlyStopping"
  kwargs: {monitor: 'val_dice', min_delta: 0,
           patience: 80, verbose: 1 , mode: 'max'}

CB_mcp: &MCP
  # Model checkpoint
  nickname: "mcp"
  class_name: "ModelCheckpoint"
  kwargs: {filepath: "./model/@epoch_{epoch:02d}_val_dice_{val_dice:.5f}.h5",
           monitor: "val_dice", save_best_only: false, save_weights_only: true,
           verbose: 1, mode: "max"}

CB_timer: &TIMER
  # Train timer callback
  nickname: "timer"
  class_name: "TrainTimer"
  pass_logger: True
  kwargs: {verbose: True}

CB_csv: &CSV
  # keras.CSVLogger
  nickname: "csv"
  class_name: "CSVLogger"
  kwargs: {filename: "logs/training.csv", separator: ",", append: true}

datasets:
  # Add dataset IDs --> relative paths here
  dataset_1: dataset_configurations/dataset_1.yaml

build:
  #
  # Hyperparameters passed to the Model.build and __init__ methods
  #
  model_class_name: "DeepSleepNet"
  l2_reg: 0.001
  padding: same

fit:
  #
  # Hyperparameters passed to the Trainer object
  #
  balanced_sampling: True
  margin: 12

  # Loss function(s)
  loss: [SparseCategoricalCrossentropy]
  # loss_kwargs:  # OBS: passed to all losses
  #   name: my_loss

  # Metric function(s)
  metrics: [SparseCategoricalAccuracy]
  # metric_kwargs:  # OBS: passed to all metrics
  #   name: my_metric

  # Ignore 'out-of-bounds' classes in loss computation (e.g. to ignore 'UNKNOWN'/'MOVEMENT' other rare classes)
  # Comment out or set to Null/False to not ignore any classes
  ignore_out_of_bounds_classes: true

  # Optimization
  batch_size: 10
  n_epochs: 200
  verbose: true
  optimizer: "Adam"
  optimizer_kwargs: {learning_rate: 1.0e-05, decay: 0.0, beta_1: 0.9, beta_2: 0.999, epsilon: 1.0e-8}

  # Options: MinMaxScaler, StandardScaler, MaxAbsScaler,
  #          RobustScaler, QuantileTransformer, Null
  scaler: "RobustScaler"

  # Callbacks
  callbacks: [*TB, *MCP, *TIMER, *CSV, *ES]

# Weights & Biases (wandb) experiment tracking configuration
# wandb is optional - install with: pip install utime[wandb] or pip install wandb
wandb:
  # Global settings (used by train, evaluate, predict)
  enabled: false  # Set to true or use --wandb flag to enable experiment tracking
  project: "deepsleepnet-finetune"  # W&B project name
  entity: null  # W&B team/user (null = use default from wandb config)
  name: null  # Run name (null = auto-generated)
  group: "finetune"  # Group for finetune runs
  tags: ["deepsleepnet", "finetune"]  # List of tags for organizing runs
  notes: "DeepSleepNet fine-tuning phase"  # Optional description
  save_code: true  # Save git commit info and code snapshot to wandb
  
  # Callback-specific settings (only used during training)
  callbacks:
    log_model: false  # Log model checkpoints as W&B artifacts (can be large)
    log_freq: "epoch"  # Logging frequency: "epoch" or integer for batch-level logging
    watch_model: true  # Use wandb.watch() to log gradients and parameters
    watch_freq: 100  # How often to log gradients/parameters (in batches)
    save_confusion_matrix: true  # Log confusion matrices during validation
    save_predictions: false  # Log sample predictions (can generate large artifacts)
